<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3c831">
  <meta name="description" content="Diario de entrenamiento semanal con planificación, cálculo de % del RM e historial local.">
  <title>Mi diario de entrenamiento · v2</title>
  <style>
    :root{--bg:#f6f6f2;--paper:#fff;--ink:#161616;--muted:#686868;--line:#e4e4df;--yellow:#f3ca31;--soft:#fff9dc;--shadow:0 3px 16px rgba(10,10,10,.035)}
    *{box-sizing:border-box}html{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}body{margin:0;line-height:1.45}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #d4a900;outline-offset:2px}
    .shell{max-width:1100px;margin:0 auto;padding:25px 24px 70px}.top{display:flex;gap:20px;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:13px}.logo{height:43px;width:43px;display:grid;place-items:center;border-radius:13px;background:var(--yellow);font-size:23px;font-weight:900}.brand h1{margin:0;font-size:24px;letter-spacing:-.75px;line-height:1.1}.brand small{font-size:12px;color:var(--muted)}
    nav{display:flex;background:#ebebe6;padding:5px;border-radius:13px;gap:4px;flex-wrap:wrap}.navbtn{border:0;border-radius:9px;background:transparent;padding:9px 15px;font-weight:700;color:#555}.navbtn.active{background:white;color:#111;box-shadow:0 1px 6px #0000000e}
    .panel{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;padding:21px}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.subtle{color:var(--muted)}.small{font-size:12px}.eyebrow{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;font-weight:800;color:#777}.h2{font-size:22px;line-height:1.2;margin:6px 0 5px;letter-spacing:-.4px}.h3{font-size:17px;margin:0}.intro{margin:0;color:var(--muted);font-size:14px}
    .btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:#161616;min-height:40px}.btn:hover{background:#f6f6f2}.btn.primary{border-color:var(--yellow);background:var(--yellow)}.btn.primary:hover{background:#e8bd23}.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:#f5f5f2}.btn.tiny{padding:6px 9px;min-height:31px;font-size:12px}.btn.danger{color:#a52c20}.btn.full{width:100%}
    .weektools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.weeklabel{font-weight:800;font-size:16px;letter-spacing:-.3px}.weekstatus{background:#fff6cc;padding:4px 9px;border-radius:7px;font-size:12px;font-weight:700}
    .daytabs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin:15px 0}.daytab{border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 7px;text-align:center;min-width:0}.daytab.active{border-color:#141414;background:#1d1d1d;color:#fff}.daytab strong{display:block;font-size:14px}.daytab span{font-size:11px;color:#777}.daytab.active span{color:#eacb57}.daytab .dot{width:5px;height:5px;background:var(--yellow);border-radius:50%;display:block;margin:6px auto -5px;visibility:hidden}.daytab.haslog .dot{visibility:visible}
    .daylead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;padding-bottom:18px}.daylead h2{font-size:23px;margin:3px 0 0;line-height:1.2}.daylead p{color:var(--muted);font-size:13px;margin:6px 0 0}.progress{font-size:12px;font-weight:800;color:#777;background:#f4f4f1;padding:7px 10px;border-radius:20px}
    .block{border:1px solid var(--line);border-radius:15px;margin:14px 0;overflow:hidden;background:#fff}.blocktop{padding:12px 15px;background:#f7f7f3;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.blocktop h3{font-size:13px;text-transform:uppercase;letter-spacing:.75px;margin:0}.num{display:inline-grid;place-items:center;height:24px;min-width:24px;border-radius:7px;background:var(--yellow);font-size:12px;margin-right:9px}.exercise{padding:16px 15px;border-top:1px solid #ededeb}.exercise:first-of-type{border-top:0}.exercisehead{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}.exname{font-size:16px;font-weight:800;letter-spacing:-.25px}.prescription{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0 4px}.tag{display:inline-flex;gap:5px;background:#f1f1ee;border-radius:6px;padding:4px 7px;font-size:12px;font-weight:650}.tag.yellow{background:#fff4c3}.tag.green{background:#e6f4e8;color:#22703a}.tag.missing{background:#fff1eb;color:#a34525}.targets{font-size:12px;color:#434343;margin:7px 0 5px;line-height:1.65}.targets strong{color:#141414}.muted-note{font-size:12px;color:var(--muted);margin:6px 0}.exercisefoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:13px}.logpanel{margin-top:14px;border-top:1px dashed var(--line);padding-top:13px}.loggrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-weight:700;color:#565656;font-size:12px}.field input,.field textarea,.field select{border:1px solid #dadad5;border-radius:9px;padding:9px 11px;background:white;width:100%;color:#111;min-width:0}.field textarea{resize:vertical;min-height:63px;line-height:1.45}.field input::placeholder,.field textarea::placeholder{color:#a1a1a1}.field.compact input{min-height:39px}.field.spanall{grid-column:1/-1}.donebox{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:750;color:#555;cursor:pointer}.donebox input{accent-color:#141414;height:18px;width:18px}.exercise.completed{border-left:3px solid #43a567}.exercise.completed .exname:after{content:" ✓";color:#3a9860}.daynote{margin-top:18px}.helper{border-left:4px solid var(--yellow);padding:10px 12px;background:#fffbe7;border-radius:7px;font-size:13px}.more{padding-top:9px;display:flex;gap:9px;flex-wrap:wrap}.emptyday{padding:25px 15px;text-align:center;background:#f7f7f3;border-radius:12px;color:#666}
    .rmtable{display:grid;grid-template-columns:minmax(170px,1fr) minmax(130px,190px);gap:12px 16px;align-items:center}.rmitem{border-bottom:1px solid var(--line);padding:9px 0}.rmitem strong{display:block}.rmitem small{color:var(--muted);font-size:12px}.rmitem input{border:1px solid #d9d9d6;border-radius:9px;padding:10px;width:100%}.alert{border:1px solid #f0dc91;background:#fffbea;padding:12px 14px;border-radius:11px;font-size:13px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.historycard{text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:15px;cursor:pointer}.historycard:hover{border-color:#b4a055;background:#fffdf5}.historycard strong{display:block}.historycard small{color:#666}
    dialog{border:0;padding:0;border-radius:19px;width:min(650px,calc(100vw - 28px));max-height:calc(100vh - 32px);box-shadow:0 25px 65px #0003;overflow:auto}dialog::backdrop{background:rgba(0,0,0,.52)}.dialoghead{padding:20px 22px 11px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.dialogbody{padding:0 22px 22px}.editgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.editgrid .wide{grid-column:1/-1}.dialogactions{display:flex;gap:9px;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:15px;margin-top:17px}.dialogactions .right{display:flex;gap:9px}.toast{position:fixed;right:19px;bottom:20px;background:#242424;color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;box-shadow:0 7px 23px #0003;z-index:100;opacity:0;pointer-events:none;transition:opacity .18s}.toast.show{opacity:1}.footer{margin-top:20px;text-align:center;color:#777;font-size:12px}.backupbar{margin-top:15px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.blanknote{font-size:12px;color:#777}.pill-link{color:#222;text-decoration:underline}.visuallyhidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:730px){.shell{padding:16px 12px 60px}.brand h1{font-size:20px}.logo{height:38px;width:38px}.panel{padding:15px;border-radius:14px}.top{margin-bottom:14px}nav{width:100%}.navbtn{flex:1;padding:9px 4px;font-size:13px}.daytabs{gap:4px}.daytab{padding:10px 3px;border-radius:9px}.daytab strong{font-size:12px}.daytab span{font-size:10px}.loggrid{grid-template-columns:1fr 1fr}.loggrid .field:nth-child(3){grid-column:1/-1}.weeklabel{font-size:14px}.exercise{padding:13px 11px}.blocktop{padding:11px}.cards{grid-template-columns:1fr}.exercisehead{gap:3px}.exname{font-size:15px}.editgrid{grid-template-columns:1fr}.editgrid .wide{grid-column:auto}.rmtable{grid-template-columns:1fr 128px}}
    @media(max-width:390px){.daytab span{display:none}.daytab{padding:12px 2px}.weektools{gap:6px}.btn{padding:8px 10px}.loggrid{grid-template-columns:1fr}.loggrid .field:nth-child(3){grid-column:auto}}
  /* Componentes adicionales de la versión 2, optimizados para móvil */
.backupstrip{display:flex;justify-content:space-between;align-items:center;gap:11px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-left:5px solid var(--yellow);border-radius:14px;padding:12px 16px;margin-bottom:15px}
.backupstrip strong{display:block;font-size:13px}.backupstrip .small{display:block;font-size:11px}.backup-actions{display:flex;gap:8px;flex-wrap:wrap}
.backup-actions .btn{white-space:nowrap}.blockbottom{padding:6px 13px 11px}
.rm-list{margin-top:8px}.rm-row{display:grid;grid-template-columns:minmax(120px,1fr) minmax(95px,155px) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rm-name{display:flex;flex-direction:column;gap:2px}.rm-name strong{font-size:14px}.rm-edit{display:flex;align-items:center;gap:7px}.rm-edit input{border:1px solid #dadad5;border-radius:8px;max-width:135px;width:100%;min-width:0;padding:10px;text-align:right;font-size:15px}.rm-edit span{white-space:nowrap}
.setdetails{margin-top:13px;border:1px solid #e7e7e0;border-radius:11px;padding:12px;background:#fbfbf8}.setdetails summary{cursor:pointer;font-weight:750;font-size:12px;list-style-position:inside}
.setlist{display:grid;gap:9px;margin-top:10px}.setcard{padding:10px;border:1px solid #e4e4dd;border-radius:10px;background:#fff}.setheading{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:9px}.setheading strong{font-size:12px}.setheading span{font-size:11px;color:#666;text-align:right}
.setgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.setgrid .field label{font-size:11px}.setgrid .field input{font-size:12px;padding:8px 6px;min-width:0}
.choose-grid{display:grid;gap:10px}.choose-grid .btn{min-height:55px;font-size:14px}
.backup-guide{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.backup-guide>div{padding:17px;border:1px solid var(--line);border-radius:13px;background:#fbfbf7}.backup-guide h3{font-size:16px;margin:10px 0 5px}.backup-guide p{font-size:13px;line-height:1.65;color:#555;min-height:130px}
.backup-icon{width:35px;height:35px;display:grid;place-items:center;border-radius:10px;background:var(--yellow);font-size:23px;font-weight:800}
.guide-list{font-size:14px;line-height:1.75;padding-left:24px}.guide-list li{padding-bottom:6px}
.loggrid{grid-template-columns:repeat(3,minmax(0,1fr))}
.loggrid .field label{display:block}.field label input,.field label textarea,.field label select{display:block;margin-top:5px}
@media(max-width:730px){.backupstrip{padding:11px}.backup-actions{width:100%}.backup-actions .btn{flex:1;font-size:12px;padding:9px 6px}.rm-row{grid-template-columns:minmax(95px,1fr) minmax(95px,125px) auto;gap:7px}.rm-name strong{font-size:12px}.rm-edit input{font-size:14px;padding:9px 5px}.rm-edit span{font-size:11px}.rm-row .btn.tiny{padding:7px 6px;font-size:11px}.setgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.backup-guide{grid-template-columns:1fr}.backup-guide p{min-height:0}.loggrid{grid-template-columns:repeat(2,minmax(0,1fr))}.loggrid .field:nth-child(3){grid-column:auto}}
@media(max-width:390px){.brand h1{font-size:19px}.backup-actions .btn{font-size:11px}.rm-edit input{max-width:105px}.rm-name .small{display:none}.setgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}

  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand"><div class="logo" aria-hidden="true">D</div><div><h1>Diario de entrenamiento</h1><small>Programación · RMs · Registro semanal</small></div></div>
      <nav aria-label="Secciones">
        <button class="navbtn active" data-action="view" data-view="week">Mi semana</button>
        <button class="navbtn" data-action="view" data-view="rms">Mis RM</button>
        <button class="navbtn" data-action="view" data-view="history">Historial</button>
        <button class="navbtn" data-action="view" data-view="help">Ayuda / copias</button>
      </nav>
    </header>
    <section class="backupstrip" aria-label="Seguridad de los datos">
      <div><strong>Tu diario se guarda en este móvil</strong><span class="small subtle" id="saveStatus">● Guardado en este navegador</span><span class="small subtle" id="backupReminder">Descarga copias periódicas de tus entrenamientos.</span></div>
      <div class="backup-actions"><button class="btn primary" data-action="export">↓ Descargar mis datos</button><button class="btn" data-action="import">↑ Restaurar copia</button></div>
    </section>
    <main id="app"></main>
    <div class="footer">Los registros se guardan en este navegador. GitHub no los sincroniza. Descarga una copia JSON semanalmente.</div>
  </div>
  <dialog id="exerciseDialog" aria-labelledby="dialogTitle"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="importFile" accept="application/json,.json" class="visuallyhidden">
  <script>
  (() => {
  'use strict';
  // Mantenemos la clave anterior: una actualización del código no borra el diario.
  const STORAGE_KEY = 'diario_entrenamiento_v1';
  const SCHEMA = 'mi-diario-entrenamiento-backup-v2';
  const DAYS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  const SHORT_DAYS = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const DEFAULT_RMS = [
    {id:'squatSnatch',name:'Snatch',kg:84},
    {id:'cleanJerk',name:'Clean & Jerk',kg:100},
    {id:'squatClean',name:'Clean',kg:100},
    {id:'jerk',name:'Jerk',kg:100},
    {id:'powerSnatch',name:'Power Snatch',kg:73},
    {id:'powerClean',name:'Power Clean',kg:93},
    {id:'powerJerk',name:'Power Jerk',kg:85},
    {id:'jerkBnk',name:'Jerk Bnk',kg:100},
    {id:'backSquat',name:'Back Squat',kg:115},
    {id:'frontSquat',name:'Front Squat',kg:110},
    {id:'overheadSquat',name:'Overhead Squat',kg:92.5},
    {id:'snatchBalance',name:'Snatch Balance',kg:85},
    {id:'pushPress',name:'Push Press',kg:78},
    {id:'deadlift',name:'Deadlift',kg:160},
    {id:'benchPress',name:'Bench Press',kg:108}
  ];
  const SET_TYPES = [
    ['normal','Normal'],['emom','EMOM'],['e2mom','E2MOM'],['e3mom','E3MOM'],
    ['superset','Superserie'],['triserie','Triserie'],['cluster','Clúster'],
    ['intervals','Intervalos'],['amrap','AMRAP'],['fortime','For time / RFT'],['other','Otro']
  ];
  const app = document.getElementById('app');
  const dialog = document.getElementById('exerciseDialog');
  const importInput = document.getElementById('importFile');
  const ui = {view:'week',day:0,editing:null};
  let toastTimer;
  let state = loadState() || initialState();

  function uid(prefix='ex') {return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,9)}`;}
  function clone(o) {return JSON.parse(JSON.stringify(o));}
  function esc(v) {return String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function dateKey(d) {return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
  function parseDate(k) {const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,12);}
  function shiftWeek(k,n) {const d=parseDate(k);d.setDate(d.getDate()+7*n);return dateKey(d);}
  function currentMonday() {const d=new Date();if(d.getDay()===0)d.setDate(d.getDate()+1);else d.setDate(d.getDate()-(d.getDay()-1));return dateKey(d);}
  function rangeLabel(k) {const a=parseDate(k),b=parseDate(k);b.setDate(b.getDate()+6);const f=new Intl.DateTimeFormat('es-ES',{day:'numeric',month:'short'});return `${f.format(a)} – ${f.format(b)} ${b.getFullYear()}`;}
  function dayOfWeek(k,i) {const d=parseDate(k);d.setDate(d.getDate()+i);return d.getDate();}
  function num(v) {if(v==null || String(v).trim()==='')return NaN;return Number(String(v).trim().replace(',','.'));}
  function fmt(v) {return Number(v).toLocaleString('es-ES',{maximumFractionDigits:2});}
  function isValidValue(v) {return Number.isFinite(num(v)) && num(v)>=0;}
  function rmName(id) {return state.rmCatalog.find(r=>r.id===id)?.name || 'RM desconocido';}
  function rmKg(id) {const n=num(state.rms[id]);return Number.isFinite(n)&&n>0?n:null;}
  function roundKg(v) {const step=Number(state.increment)||2.5;return Number((Math.round((v+Number.EPSILON)/step)*step).toFixed(3));}
  function notice(message,error=false) {const t=document.getElementById('toast');t.textContent=message;t.style.background=error?'#a52c20':'#222';t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),4000);}
  function methodFromText(method) {
    const t=String(method||'').toLowerCase();
    if(t.includes('e2mom'))return 'e2mom';
    if(t.includes('e3mom'))return 'e3mom';
    if(t.includes('emom'))return 'emom';
    if(t.includes('superserie'))return 'superset';
    if(t.includes('clúster')||t.includes('cluster'))return 'cluster';
    if(t.includes('amrap'))return 'amrap';
    if(t.includes('descanso')||t.includes('min de descanso'))return 'normal';
    return 'normal';
  }
  function exercise(name,sets,reps,method='',rm='',pct='',rir='',description='',plannedLoad='') {
    const type=methodFromText(method);
    const duration=(method.match(/(\d+)\s*min/i)||[])[1]||'';
    let restSeconds='';
    if(/2\s*min.*descanso|descanso\s*2\s*min/i.test(method))restSeconds='120';
    if(/2[–-]3\s*min/i.test(method))restSeconds='150';
    if(/superserie/i.test(method))restSeconds='30';
    return {id:uid(),kind:'exercise',name,sets,reps,method,seriesType:type,durationMin:['emom','e2mom','e3mom'].includes(type)?duration:'',restSeconds,rm,pct,rir,description,plannedLoad,actual:emptyExerciseLog()};
  }
  function emptyExerciseLog() {return {load:'',reps:'',rir:'',percent:'',rest:'',comments:'',series:[],done:false};}
  function wod(name,plan) {return {id:uid(),kind:'wod',name,plan,actual:{result:'',comments:'',done:false}};}
  function block(title,exercises) {return {id:uid('bl'),title,exercises};}

    function templateDays(){return [
      {focus:'Halterofilia + hipertrofia + HIIT',guide:'Piernas relativamente frescas para la tirada larga del martes.',note:'',blocks:[
        block('Halterofilia',[
          exercise('Power Clean + Jerk',10,'2','EMOM 10 min','powerClean','60,60,60,65,65,65,65,70,70,70','','2 repeticiones cada minuto. La capacidad de Jerk puede limitar la carga.'),
          exercise('Squat Clean con doble pausa',5,'2','E2MOM 10 min','squatClean','55,57.5,60,62.5,65','','Pausa bajo rodilla y pausa bajo cadera antes del Squat Clean.')
        ]),
        block('Hipertrofia',[
          exercise('Press banca con mancuernas',4,'8','','','','1–2','Carga indicada por mancuerna.'),
          exercise('Dominadas',5,'8,8,5,5,5','','','','1–2','Dos series de 8 repeticiones y tres de 5. Ajustar lastre o asistencia.'),
          exercise('Remo Bird Dog con kettlebell',4,'8–10 por lado','','','','1–2','Mantener estable la pelvis.')
        ]),
        block('Interválico de alta intensidad',[
          wod('HIIT: ejercicio + máquina','Ejercicio: pendiente de definir\nMáquina: SkiErg / RowErg / AirBike / EchoBike\nIntervalos: pendiente de definir')
        ])
      ]},
      {focus:'Carrera / trail',guide:'Tirada larga por montaña. Registra distancia, tiempo, desnivel y sensaciones.',note:'',blocks:[]},
      {focus:'Halterofilia + fuerza + WOD largo + core',guide:'Adaptar el volumen de piernas a la recuperación del trail.',note:'',blocks:[
        block('Halterofilia',[
          exercise('Squat Snatch desde suelo',10,'2','EMOM 10 min','squatSnatch','65,65,65,67.5,67.5,67.5,70,70,72.5,72.5','','Prioridad a la técnica y a la recepción estable.'),
          exercise('Hang Power Snatch',5,'2','E2MOM 10 min','powerSnatch','65,67.5,70,72.5,75','','Cinco series cada dos minutos.')
        ]),
        block('Fuerza',[
          exercise('Sentadilla frontal',5,'5,5,3,3,3','Descanso 2–3 min','frontSquat','67.5,70,75,77.5,80','2–3','Si el trail deja fatiga, reducir el porcentaje manteniendo repeticiones.')
        ]),
        block('WOD largo',[
          wod('WOD largo (configurar en texto)','Movimientos que quiero incluir:\n- Muscle Ups en barra o anillas\n- Zancadas con mancuernas\n\nFormato, rondas y repeticiones: por definir')
        ]),
        block('Core y glúteos · superserie 4 vueltas',[

  function initialState() {
    const monday=currentMonday();
    return {version:2,selectedWeek:monday,increment:2.5,
      rmCatalog:DEFAULT_RMS.map(({id,name})=>({id,name})),
      rms:Object.fromEntries(DEFAULT_RMS.map(({id,kg})=>[id,kg])),
      lastBackupAt:null,
      weeks:{[monday]:{days:templateDays(),createdAt:new Date().toISOString()}}};
  }
  function validate(s) {
    if(!s || typeof s!=='object' || ![1,2].includes(s.version) ||
       typeof s.selectedWeek!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s.selectedWeek)||
       !s.weeks || typeof s.weeks!=='object'||Array.isArray(s.weeks)||
       !s.rms || typeof s.rms!=='object'||Array.isArray(s.rms))return false;
    const wk=s.weeks[s.selectedWeek];
    if(!wk||!Array.isArray(wk.days)||wk.days.length!==7)return false;
    for(const w of Object.values(s.weeks)) {
      if(!w||!Array.isArray(w.days)||w.days.length!==7)return false;
      for(const d of w.days) {
        if(!d||!Array.isArray(d.blocks))return false;
        for(const b of d.blocks)if(!b||!Array.isArray(b.exercises))return false;
      }
    }
    if(s.version===2 && (!Array.isArray(s.rmCatalog)||s.rmCatalog.length>1000||
      s.rmCatalog.some(r=>!r||typeof r.id!=='string'||!/^[a-zA-Z0-9_-]{1,70}$/.test(r.id)||typeof r.name!=='string')))
      return false;
    return true;
  }
  function normalizeState(saved) {
    // Migración sin pérdida de datos desde la primera versión del mismo index.html.
    if(saved.version===1) {
      const original=saved.rms||{};
      saved.rmCatalog=DEFAULT_RMS.map(({id,name})=>({id,name}));
      saved.rms=Object.fromEntries(DEFAULT_RMS.map(({id,kg})=>[id,original[id]!==''&&original[id]!=null?original[id]:kg]));
      saved.version=2;
    }
    saved.lastBackupAt ||= null;
    saved.rmCatalog.forEach(r=>{if(saved.rms[r.id]===undefined)saved.rms[r.id]='';});
    for(const wk of Object.values(saved.weeks))for(const day of wk.days)for(const b of day.blocks)for(const item of b.exercises){
      if(item.kind==='exercise') {
        item.seriesType ||= methodFromText(item.method);
        if(item.restSeconds===undefined)item.restSeconds='';
        if(item.durationMin===undefined)item.durationMin='';
        item.actual ||= emptyExerciseLog();
        item.actual.series ||= [];
        item.actual.percent ??= '';
        item.actual.rest ??= '';
      }
    }
    return saved;
  }
  function loadState() {
    try {const data=localStorage.getItem(STORAGE_KEY);if(!data)return null;const parsed=JSON.parse(data);if(!validate(parsed))return null;return normalizeState(parsed);}
    catch(e){console.warn('No se pudieron leer los datos locales',e);return null;}
  }
  function save() {

    catch(e){console.error('Error de almacenamiento',e);const el=document.getElementById('saveStatus');if(el)el.textContent='⚠ No se pudo guardar';notice('ERROR al guardar. Descarga una copia JSON e intenta liberar espacio.',true);return false;}
  }
  function week() {return state.weeks[state.selectedWeek];}
  function findItem(day,blockId,itemId) {const d=week().days[day],b=d?.blocks.find(x=>x.id===blockId);return {day:d,block:b,item:b?.exercises.find(x=>x.id===itemId)};}
  function percentageList(item) {
    const raw=String(item.pct||'').trim();
    if(!raw)return [];
    const parts=raw.split(/[;,]/).map(v=>num(v)).filter(Number.isFinite);
    return Array.from({length:Math.max(0,Math.min(200,Number(item.sets)||1))},(_,i)=>parts[Math.min(i,parts.length-1)]);
  }
  function repList(item) {
    const raw=String(item.reps||'').trim();
    const items=raw.split(/[,;]/).map(v=>v.trim()).filter(Boolean);
    return Array.from({length:Math.max(0,Math.min(200,Number(item.sets)||1))},(_,i)=>items[Math.min(i,items.length-1)]||'');
  }
  function targetForSet(item,index) {
    const p=percentageList(item)[index];
    const rm=rmKg(item.rm);
    return {p:p===undefined?null:p,kg:p!==undefined&&rm!==null?roundKg(rm*p/100):null};
  }
  function targetHTML(item) {
    if(!item.rm || !String(item.pct||'').trim())return '';
    if(rmKg(item.rm)===null)return `<div class="targets"><span class="tag missing">Introduce el 1RM de ${esc(rmName(item.rm))} para calcular los kg.</span></div>`;
    const groups=[];
    percentageList(item).forEach((p,i)=>{const kg=targetForSet(item,i).kg,last=groups[groups.length-1];
      if(last&&last.p===p&&last.kg===kg)last.count++;else groups.push({p,kg,count:1});});
    return `<div class="targets">${groups.map(g=>`<span class="tag yellow">${fmt(g.p)}% ${esc(rmName(item.rm))} → <strong>${fmt(g.kg)} kg</strong>${g.count>1?' × '+g.count+' series':''}</span>`).join('')}</div>`;
  }

  function cloneWeek(fromKey,toKey){const source=state.weeks[fromKey];if(!source)return false;const days=clone(source.days);
    days.forEach(d=>{d.note='';d.blocks.forEach(b=>b.exercises.forEach(item=>{const prev=item.actual||{};
      if(item.kind==='exercise'){
        const lastSet=[...(prev.series||[])].reverse().find(s=>isValidValue(s?.load));
        const completedLoad=String(prev.load||'').trim()||String(lastSet?.load||'').trim();
        if(!item.rm&&!String(item.pct||'').trim()&&/^\d+(?:[.,]\d+)?$/.test(completedLoad))item.plannedLoad=completedLoad.replace(',','.');
        item.actual=emptyExerciseLog();
      }else if(item.kind==='wod')item.actual={result:'',comments:'',done:false};
    }));});
    state.weeks[toKey]={days,createdAt:new Date().toISOString()};return true;}
  function moveSelectedWeek(direction){const dest=shiftWeek(state.selectedWeek,direction);const created=!state.weeks[dest];if(created)cloneWeek(state.selectedWeek,dest);state.selectedWeek=dest;ui.day=0;save();render();if(created)notice('Semana creada con la programación anterior y registros vacíos.');}
  function selectRMOptions(selected){return `<option value="">Sin RM (usar RIR o kg manuales)</option>${state.rmCatalog.map(r=>`<option value="${esc(r.id)}" ${r.id===selected?'selected':''}>${esc(r.name)} (${rmKg(r.id)!==null?fmt(rmKg(r.id))+' kg':'sin kg'})</option>`).join('')}`;}
  function openExerciseEditor(dayIndex,blockId,itemId=null){const b=week().days[dayIndex].blocks.find(x=>x.id===blockId);if(!b)return;
    const ex=itemId?b.exercises.find(x=>x.id===itemId):exercise('Nuevo ejercicio',3,'8');if(!ex||ex.kind==='wod')return;
    ui.editing={type:'exercise',dayIndex,blockId,itemId};
    const t=ex.seriesType||methodFromText(ex.method);
    const options=SET_TYPES.map(([key,label])=>`<option value="${key}" ${key===t?'selected':''}>${esc(label)}</option>`).join('');
    dialog.innerHTML=`<form id="exerciseForm"><div class="dialoghead"><div><div class="eyebrow">${itemId?'EDITAR EJERCICIO':'NUEVO EJERCICIO'}</div><h2 class="h2" id="dialogTitle">Programación estructurada</h2></div><button type="button" class="btn tiny" data-action="closeDialog">✕</button></div>
    <div class="dialogbody"><div class="editgrid">
      <div class="field wide"><label>Nombre del ejercicio<input name="name" required maxlength="130" value="${esc(ex.name)}"></label></div>
      <div class="field"><label>Series<input name="sets" required type="number" min="1" max="200" value="${esc(ex.sets)}"></label></div>
      <div class="field"><label>Repeticiones (por serie)<input name="reps" required value="${esc(ex.reps)}" placeholder="8 o 8,8,5,5,5"></label></div>
      <div class="field"><label>Tipo de serie<select name="seriesType">${options}</select></label></div>
      <div class="field"><label>Minutos del bloque (opcional)<input name="durationMin" inputmode="decimal" value="${esc(ex.durationMin||'')}" placeholder="Ej.: 10"></label></div>
      <div class="field"><label>Descanso (segundos)<input name="restSeconds" type="number" min="0" max="3600" value="${esc(ex.restSeconds||'')}" placeholder="Ej.: 120"></label></div>
      <div class="field"><label>RIR objetivo<input name="rir" value="${esc(ex.rir||'')}" placeholder="Ej.: 1-2"></label></div>
      <div class="field wide"><label>Vincular a un RM de referencia<select name="rm">${selectRMOptions(ex.rm)}</select></label></div>
      <div class="field wide"><label>Porcentaje del RM (global o por serie)<input name="pct" value="${esc(ex.pct||'')}" placeholder="Ej.: 65 o 60,60,65,70"></label></div>
      <div class="field wide"><label>Carga manual objetivo en kg (opcional)<input name="plannedLoad" inputmode="decimal" value="${esc(ex.plannedLoad||'')}" placeholder="Para ejercicios sin porcentajes: 32"></label></div>
      <div class="field wide"><label>Notas de programación<textarea rows="3" name="description">${esc(ex.description||'')}</textarea></label></div>
    </div>
    <div class="more"><button class="btn tiny" type="button" data-action="plusPercent">+ 2,5 puntos %</button><button class="btn tiny" type="button" data-action="plusRep">+ 1 repetición por serie</button></div>
    <p class="small subtle">Para progresiones, separa las series con comas. Usa punto para decimales: <strong>60,60,67.5,70</strong>. Si escribes un solo %, se aplica a todas las series. El tipo EMOM/E2MOM define la frecuencia de inicio; el descanso real puede registrarse después.</p>
    <div class="dialogactions">${itemId?'<button type="button" class="btn danger" data-action="deleteExercise">Eliminar</button>':'<span></span>'}<div class="right"><button class="btn" type="button" data-action="closeDialog">Cancelar</button><button type="submit" class="btn primary">Guardar ejercicio</button></div></div></div></form>`;
    dialog.showModal();
  }
  function openAddDialog(blockId){ui.editing={type:'choose',blockId,dayIndex:ui.day};dialog.innerHTML=`<div class="dialoghead"><div><div class="eyebrow">NUEVO ELEMENTO</div><h2 class="h2" id="dialogTitle">¿Qué quieres añadir?</h2></div><button class="btn tiny" data-action="closeDialog">✕</button></div><div class="dialogbody"><div class="choose-grid"><button class="btn full" data-action="createExercise">Ejercicio con series, %, RIR y cargas</button><button class="btn full" data-action="createWod">WOD o HIIT con texto libre</button></div></div>`;dialog.showModal();}
  function openRMEditor(id=null){const rm=id?state.rmCatalog.find(r=>r.id===id):null;if(id&&!rm)return;
    ui.editing={type:'rm',id};dialog.innerHTML=`<form id="rmForm"><div class="dialoghead"><div><div class="eyebrow">${rm?'MODIFICAR REFERENCIA':'AÑADIR REFERENCIA'}</div><h2 class="h2" id="dialogTitle">${rm?'Editar RM':'Nuevo RM'}</h2></div><button type="button" class="btn tiny" data-action="closeDialog">✕</button></div><div class="dialogbody"><div class="editgrid">
      <div class="field wide"><label>Ejercicio<input name="name" required maxlength="100" value="${esc(rm?.name||'')}" placeholder="Ej.: Press militar"></label></div>
      <div class="field wide"><label>1RM (kg)<input name="kg" required type="text" inputmode="decimal" value="${esc(rm?state.rms[rm.id]??'':'')}" placeholder="Ej.: 72,5"></label></div>
    </div><p class="small subtle">Podrás elegir este RM en cualquier ejercicio de la programación. Los enlaces a un RM se conservan aunque cambies su nombre.</p>
    <div class="dialogactions">${rm&&!DEFAULT_RMS.some(x=>x.id===rm.id)?'<button type="button" class="btn danger" data-action="deleteRM">Eliminar RM</button>':'<span></span>'}<div class="right"><button class="btn" type="button" data-action="closeDialog">Cancelar</button><button type="submit" class="btn primary">Guardar RM</button></div></div></div></form>`;
    dialog.showModal();}

  function saveExerciseEditor(){const f=dialog.querySelector('#exerciseForm');if(!f||!f.reportValidity())return;
    const v=Object.fromEntries(new FormData(f).entries());
    const sets=Number(v.sets);
    if(!(Number.isInteger(sets)&&sets>=1&&sets<=200)){notice('Usa entre 1 y 200 series.',true);return;}
    if(!v.name.trim()||!v.reps.trim()){notice('Introduce nombre y repeticiones.',true);return;}
    if(v.pct.trim()){
      const vals=v.pct.split(/[;,]/).map(x=>num(x));
      if(vals.some(x=>!Number.isFinite(x)||x<0||x>200)){notice('Revisa los porcentajes: usa comas entre series y punto para decimales.',true);return;}
    }
    if(v.durationMin.trim()&&(!Number.isFinite(num(v.durationMin))||num(v.durationMin)<=0||num(v.durationMin)>240)){notice('La duración debe estar entre 0 y 240 minutos.',true);return;}
    if(v.plannedLoad.trim()&&!isValidValue(v.plannedLoad)){notice('La carga manual debe ser un peso válido.',true);return;}
    const editing=ui.editing,bl=week().days[editing.dayIndex].blocks.find(b=>b.id===editing.blockId);
    if(!bl)return;
    let item=editing.itemId?bl.exercises.find(e=>e.id===editing.itemId):exercise('',sets,'');
    if(!item)return;
    Object.assign(item,{name:v.name.trim(),sets,reps:v.reps.trim(),seriesType:v.seriesType||'normal',durationMin:v.durationMin.trim().replace(',','.'),restSeconds:v.restSeconds.trim(),rm:v.rm,pct:v.pct.trim(),rir:v.rir.trim(),plannedLoad:v.plannedLoad.trim().replace(',','.'),description:v.description.trim(),method:''});
    if(!editing.itemId)bl.exercises.push(item);
    dialog.close();save();render();notice('Ejercicio guardado.');
  }
  function saveRMEditor(){const f=dialog.querySelector('#rmForm');if(!f||!f.reportValidity())return;
    const v=Object.fromEntries(new FormData(f).entries()),name=v.name.trim(),kg=num(v.kg);
    if(!name||!Number.isFinite(kg)||kg<=0||kg>2000){notice('Indica un nombre y un RM mayor que 0 kg.',true);return;}
    if(state.rmCatalog.some(x=>x.name.toLocaleLowerCase('es')===name.toLocaleLowerCase('es')&&x.id!==ui.editing.id)){notice('Ya existe un RM con ese nombre.',true);return;}
    let id=ui.editing.id;
    if(!id){id=uid('rm');state.rmCatalog.push({id,name});}
    else {const rm=state.rmCatalog.find(x=>x.id===id);if(!rm)return;rm.name=name;}
    state.rms[id]=kg;
    dialog.close();save();render();notice('RM guardado. Los pesos se recalculan automáticamente.');
  }
  function adjustPercent(){const el=dialog.querySelector('[name="pct"]');if(!el||!el.value.trim()){notice('Este ejercicio no tiene porcentajes.',true);return;}
    const values=el.value.split(/[;,]/).map(x=>num(x));if(values.some(x=>!Number.isFinite(x))){notice('Porcentajes inválidos.',true);return;}
    el.value=values.map(x=>Number(Math.min(200,x+2.5).toFixed(2))).join(',');
  }
  function adjustReps(){const el=dialog.querySelector('[name="reps"]');if(el)el.value=el.value.replace(/\d+/g,v=>String(Number(v)+1));}
  function isRMUsed(id){return Object.values(state.weeks).some(w=>w.days.some(d=>d.blocks.some(b=>b.exercises.some(e=>e.rm===id))));}
  function deleteCustomRM(){const id=ui.editing?.id;if(!id)return;
    if(DEFAULT_RMS.some(x=>x.id===id))return;
    if(isRMUsed(id)){notice('Este RM está vinculado a ejercicios. Cambia primero su referencia.',true);return;}
    if(!confirm('¿Eliminar este RM personalizado?'))return;
    state.rmCatalog=state.rmCatalog.filter(x=>x.id!==id);delete state.rms[id];dialog.close();save();render();notice('RM eliminado.');
  }
  function deleteExercise(){const e=ui.editing;if(!e||e.type!=='exercise'||!e.itemId)return;
    if(!confirm('¿Eliminar este ejercicio únicamente de esta semana?'))return;
    const bl=week().days[e.dayIndex].blocks.find(x=>x.id===e.blockId);
    bl.exercises=bl.exercises.filter(x=>x.id!==e.itemId);dialog.close();save();render();notice('Ejercicio eliminado.');
  }
  // Un solo archivo portable contiene todos los datos y semanas. NO se sube a GitHub.
  function downloadBackup(){const previous=state.lastBackupAt;state.lastBackupAt=new Date().toISOString();
    if(!save()){state.lastBackupAt=previous;return;}
    try {
      const json={schema:SCHEMA,exportedAt:new Date().toISOString(),data:clone(state)};
      const blob=new Blob([JSON.stringify(json,null,2)],{type:'application/json;charset=utf-8'});
      const url=URL.createObjectURL(blob),a=document.createElement('a');
      const t=new Date(),stamp=`${dateKey(t)}_${String(t.getHours()).padStart(2,'0')}${String(t.getMinutes()).padStart(2,'0')}`;
      a.href=url;a.download=`diario_entrenamiento_copia_${stamp}.json`;
      document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);
      renderSaveStatus();notice('Copia preparada. Comprueba que el JSON esté guardado en Archivos o Descargas.');
    } catch(err) {console.error(err);state.lastBackupAt=previous;save();notice('No se pudo generar el JSON. Inténtalo en Safari o Chrome.',true);}
  }
  async function importBackup(file){if(!file)return;
    if(file.size>20*1024*1024){notice('El archivo es demasiado grande (máximo 20 MB).',true);return;}
    try {const parsed=JSON.parse(await file.text());const input=parsed&&parsed.schema===SCHEMA?parsed.data:parsed;
      if(!validate(input)){notice('El archivo no contiene un diario compatible.',true);return;}
      if(!confirm('Se reemplazarán todos los datos que hay en este navegador por los de esta copia. ¿Restaurar?'))return;
      const previous=state;
      state=normalizeState(clone(input));
      if(!save()){state=previous;notice('No se pudo restaurar por falta de espacio o permisos. No se han cambiado los datos guardados.',true);return;}
      ui.view='week';ui.day=0;render();notice('Copia restaurada: RM, semanas y registros recuperados.');
    }catch(err){console.error(err);notice('No se pudo leer el JSON. Selecciona una copia válida.',true);}
  }
  document.addEventListener('click',evt=>{
    const btn=evt.target.closest('[data-action]');if(!btn)return;
    const action=btn.dataset.action;
    if(action==='view'){ui.view=btn.dataset.view;render();}
    else if(action==='day'){ui.day=Number(btn.dataset.day);render();}
    else if(action==='prevWeek')moveSelectedWeek(-1);
    else if(action==='nextWeek')moveSelectedWeek(1);
    else if(action==='openWeek'){state.selectedWeek=btn.dataset.week;ui.day=0;ui.view='week';save();render();}
    else if(action==='editExercise')openExerciseEditor(ui.day,btn.dataset.block,btn.dataset.ex);
    else if(action==='addItem')openAddDialog(btn.dataset.block);
    else if(action==='createExercise'){const e=ui.editing;dialog.close();openExerciseEditor(e.dayIndex,e.blockId);}
    else if(action==='createWod'){const e=ui.editing,b=week().days[e.dayIndex].blocks.find(x=>x.id===e.blockId);dialog.close();b.exercises.push(wod('Nuevo WOD / HIIT',''));save();render();notice('WOD añadido: escribe su formato y movimientos.');}
    else if(action==='addBlock'){const n=prompt('Nombre del nuevo bloque:','Accesorios');if(n&&n.trim()){week().days[ui.day].blocks.push(block(n.trim(),[]));save();render();}}
    else if(action==='renameBlock'){const b=week().days[ui.day].blocks.find(x=>x.id===btn.dataset.block);if(!b)return;const n=prompt('Nombre del bloque:',b.title);if(n&&n.trim()){b.title=n.trim();save();render();}}
    else if(action==='deleteBlock'){if(confirm('¿Eliminar este bloque vacío?')){const d=week().days[ui.day];d.blocks=d.blocks.filter(x=>x.id!==btn.dataset.block);save();render();}}
    else if(action==='deleteWod'){if(confirm('¿Eliminar este WOD de esta semana?')){const b=week().days[ui.day].blocks.find(x=>x.id===btn.dataset.block);b.exercises=b.exercises.filter(x=>x.id!==btn.dataset.ex);save();render();}}
    else if(action==='closeDialog')dialog.close();
    else if(action==='addRM')openRMEditor();
    else if(action==='editRM')openRMEditor(btn.dataset.rm);
    else if(action==='deleteRM')deleteCustomRM();
    else if(action==='deleteExercise')deleteExercise();
    else if(action==='plusPercent')adjustPercent();
    else if(action==='plusRep')adjustReps();
    else if(action==='export')downloadBackup();
    else if(action==='import')importInput.click();
  });
  dialog.addEventListener('submit',e=>{if(e.target.id==='exerciseForm'){e.preventDefault();saveExerciseEditor();}else if(e.target.id==='rmForm'){e.preventDefault();saveRMEditor();}});
  document.addEventListener('input',e=>{
    const el=e.target,t=el.dataset.input;if(!t)return;
    if(t==='dayNote')week().days[ui.day].note=el.value;
    else if(['actual','setActual','wodPlan','wodActual'].includes(t)){
      const item=findItem(ui.day,el.dataset.block,el.dataset.ex).item;if(!item)return;
      if(t==='wodPlan')item.plan=el.value;
      else if(t==='setActual'){item.actual ||= emptyExerciseLog();item.actual.series ||= [];
        const i=Number(el.dataset.index);item.actual.series[i] ||= {load:'',reps:'',rir:'',rest:'',percent:''};item.actual.series[i][el.dataset.field]=el.value;}
      else {item.actual ||= {};item.actual[el.dataset.field]=el.value;}
    }
    else if(t==='rm'){
      if(el.value.trim()==='')state.rms[el.dataset.rm]='';
      else if(isValidValue(el.value))state.rms[el.dataset.rm]=num(el.value);
      else return;
    } else return;
    save();
  });
  document.addEventListener('change',e=>{
    const el=e.target,t=el.dataset.input;
    if(t==='done'){
      const item=findItem(ui.day,el.dataset.block,el.dataset.ex).item;if(!item)return;item.actual ||= {};item.actual.done=el.checked;save();render();
    }else if(t==='increment'){state.increment=Number(el.value)||2.5;save();render();notice('Redondeo actualizado.');}
    else if(t==='rm'){
      const v=el.value.trim();if(v!==''&&!isValidValue(v)){
        notice('RM inválido: escribe un valor numérico (ej.: 92,5).',true);el.value=String(state.rms[el.dataset.rm]??'');
      } else {save();notice('RM guardado. Los kilos se actualizarán en Mi semana.');}
    }
  });
  importInput.addEventListener('change',async()=>{const file=importInput.files?.[0];importInput.value='';await importBackup(file);});
  window.addEventListener('storage',event=>{if(event.key!==STORAGE_KEY||!event.newValue)return;
    try{const incoming=JSON.parse(event.newValue);if(validate(incoming)){state=normalizeState(incoming);render();}}catch(err){console.warn(err);}
  });
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save();});
  window.addEventListener('pagehide',()=>save());
  render();save();
})();

  </script>
</body>
</html>
