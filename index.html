<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f1cb39"><meta name="description" content="Entrenardos: diario semanal de entrenamiento, RMs, WODs e historial con copias JSON."><title>Entrenardos · Diario de entrenamiento V3.6</title>
<style id="entrenardos-inline-style">
:root{color-scheme:light;--ink:#181a1b;--muted:#62676b;--bg:#f5f5f1;--white:#fff;--line:#e1e1db;--yellow:#f1cb39;--pale:#fff7d6;--green:#23744d;--greenbg:#e9f7ef;--red:#b13f36;--shadow:0 2px 15px rgba(22,22,19,.035)}

*{box-sizing:border-box}
html{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{margin:0}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #d8a900;outline-offset:2px}
h1,h2,h3,p{margin:0 0 9px}
h2{font-size:23px;letter-spacing:-.5px}
h3{font-size:16px}
a{color:#25251a}
button,input,textarea,select{min-width:0}
textarea{resize:vertical;min-height:78px}
input,select,textarea{border:1px solid #d4d5d0;background:#fff;border-radius:9px;padding:10px 11px;width:100%;color:#222}
input[type=checkbox]{width:19px;height:19px;accent-color:#d9b008}
.app{max-width:1160px;margin:0 auto;padding:17px 17px 100px}
.header{display:flex;align-items:center;gap:11px;justify-content:space-between;flex-wrap:wrap;margin-bottom:15px}
.brand{display:flex;align-items:center;gap:12px}
.brandmark{background:var(--yellow);width:43px;height:43px;border-radius:13px;display:grid;place-items:center;font-size:21px;font-weight:900}
.brand h1{margin:0;font-size:23px;letter-spacing:-.5px;line-height:1.1}
.brand small{font-size:12px;color:var(--muted)}
.header-actions{display:flex;gap:7px;flex-wrap:wrap}
.navigation{display:flex;gap:5px;overflow:auto;scrollbar-width:none;position:sticky;top:0;z-index:25;padding:7px 4px;background:var(--bg);border-radius:13px;margin-bottom:16px}
.navigation::-webkit-scrollbar{display:none}
.nav{flex:0 0 auto;border:1px solid transparent;background:#e9e9e4;padding:9px 13px;border-radius:10px;font-weight:700;white-space:nowrap;color:#404240}
.nav.active{background:#222;color:#fff}
.nav:hover:not(.active){background:#ddddda}
.btn{background:#fff;border:1px solid #d9d9d2;padding:9px 13px;min-height:39px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:10px;font-weight:700;font-size:13px;line-height:1.25;text-align:center;white-space:normal;color:#181818}
.btn:hover{background:#f4f4f0}
.btn.primary{background:var(--yellow);border-color:#e5bf2b;color:#171717}
.btn.primary:hover{background:#edc32a}
.btn.dark{background:#222;color:white;border-color:#222}
.btn.dark:hover{background:#444}
.btn.danger{color:#a33328}
.btn.small{min-height:30px;padding:6px 9px;font-size:12px}
.btn.icon{min-width:34px;padding:7px 8px}
.btn.full{width:100%}
.btn.active{background:#222;color:#fff}
.flex{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1}
.subtle{color:var(--muted)}
.smalltext{font-size:12px}
.tiny{font-size:11px}
.eyebrow{font-size:11px;font-weight:800;color:#747873;text-transform:uppercase;letter-spacing:1.1px}
.paper{background:var(--white);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:17px;padding:18px;margin-bottom:13px}
.banner{padding:12px 14px;border:1px solid #e9d08b;background:#fff9e8;border-radius:13px;margin-bottom:13px;font-size:13px}
.banner p{margin:0}
.backupbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:11px 14px;background:var(--white);border:1px solid var(--line);border-left:4px solid var(--yellow);border-radius:13px;margin-bottom:14px}
.backupbar strong{font-size:13px}
.backupbar .subtle{display:block;font-size:11px}
.weekbar{display:flex;align-items:center;gap:9px;justify-content:space-between;flex-wrap:wrap}
.week-title{font-size:18px;font-weight:850;letter-spacing:-.35px}
.weekbar-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.daygrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:15px 0}
.daybtn{background:#fff;border:1px solid var(--line);padding:10px 3px;border-radius:11px;display:grid;gap:4px;justify-items:center;min-width:0;color:#333}
.daybtn span{font-weight:850;font-size:12px}
.daybtn small{font-size:11px;color:#727272}
.daybtn.active{background:#222;color:#fff;border-color:#222}
.daybtn.active small{color:#f5d563}
.daybtn.today:not(.active){border:2px solid #e9c135}
.daybtn .dot{width:6px;height:6px;background:var(--yellow);border-radius:50%;opacity:0}
.daybtn.hasdone .dot{opacity:1}
.tabswitch{display:flex;background:#edede8;border-radius:11px;gap:4px;padding:4px}
.tabswitch .btn{flex:1;border:0;background:transparent;min-width:0}
.tabswitch .btn.active{background:white;color:#171717;box-shadow:0 1px 5px #00000015}
.lead{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin:8px 0 15px}
.lead h2{margin:1px 0 5px}
.lead p{font-size:13px;color:var(--muted);margin:0}
.block{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px;background:#fff}
.blockhead{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#f7f7f4;padding:11px 12px;flex-wrap:wrap}
.blockhead strong{font-size:14px}
.blockhead small{font-size:11px;color:var(--muted)}
.blockbody{padding:2px 12px}
.item{padding:14px 0;border-top:1px solid #ebebe7}
.item:first-child{border:0}
.itemname{font-weight:820;font-size:16px;letter-spacing:-.2px}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}
.chip{display:inline-block;background:#f0f0eb;border-radius:7px;padding:4px 7px;font-weight:650;font-size:11px}
.chip.yellow{background:#fff0b2}
.chip.green{background:var(--greenbg);color:var(--green)}
.chip.warning{background:#fbe8e2;color:#973b30}
.itemhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.itemhead .actions{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.presc{font-size:12px;color:#444;line-height:1.7;margin:7px 0}
.series-preview{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0 3px}
.series-preview span{font-size:11px;padding:5px 7px;background:#f5f5ef;border:1px solid #e4e4df;border-radius:7px;white-space:nowrap}
.daynote{margin:15px 0}
.controls-bottom{padding:10px 13px 13px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line)}
.logpanel{margin-top:12px;padding-top:12px;border-top:1px dashed #dadbd5}
.loggrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.field{display:block;min-width:0}
.field label,.label{font-size:11px;font-weight:750;display:block;color:#5a5a57;margin-bottom:4px}
.field input,.field select,.field textarea{padding:9px 8px;font-size:13px}
.field.wide{grid-column:1/-1}
.checkline{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:750}
.checkline input{flex:0 0 auto}
.doneitem{border-left:3px solid #39965b;padding-left:10px}
.log-hint{font-size:12px;background:#fff9dd;padding:8px 10px;border-radius:8px;margin:10px 0 3px}
.setdetails{margin-top:11px;background:#fafaf7;border-radius:10px;border:1px solid #e7e7e3;padding:9px}
.setdetails summary{font-weight:700;font-size:12px;cursor:pointer}
.setlogrow{display:grid;grid-template-columns:35px repeat(4,minmax(0,1fr));gap:5px;align-items:center;padding:8px 0;border-bottom:1px solid #ecece8}
.setlogrow:last-child{border:0}
.setlogrow input{font-size:12px;padding:8px 5px;text-align:center}
.wodtext{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.62;background:#fafaf7;padding:12px;border-radius:10px;margin:10px 0}
.workout-card{border:1px solid var(--line);border-radius:13px;background:#fff;padding:14px;margin:0 0 12px}
.workout-card h3{margin:0 0 5px;font-size:15px}
.workout-card .meta{font-size:11px;color:var(--muted);margin-bottom:6px}
.workout-card details{margin:9px 0}
.workout-card summary{font-size:12px;font-weight:750;cursor:pointer}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.library-toolbar{display:grid;grid-template-columns:minmax(180px,2fr) 1fr 1fr;gap:9px;margin:12px 0}
.library-status{color:#666;font-size:12px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.empty{text-align:center;padding:24px 15px;background:#f8f8f4;border:1px dashed #d7d7cc;border-radius:13px;color:#666;font-size:13px}
.history-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.history-item{text-align:left;border:1px solid var(--line);border-radius:12px;padding:15px;background:#fff}
.history-item strong{display:block}
.history-item small{color:#777}
.rm-row{display:grid;grid-template-columns:minmax(120px,1fr) minmax(90px,150px) 40px;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rm-row strong{font-size:14px}
.rm-row input{text-align:right}
.helper{padding:11px 13px;border-radius:10px;background:var(--pale);font-size:13px}
.footer{text-align:center;color:#777;font-size:11px;padding:18px}
.highlight{color:#155e35}
.muted{color:#777}
.modal{width:min(720px,calc(100vw - 20px));max-height:calc(100dvh - 25px);border:0;border-radius:17px;box-shadow:0 25px 80px #0005;padding:0;overflow:auto}
.modal::backdrop{background:rgba(12,12,12,.56)}
.modalhead{position:sticky;top:0;background:white;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:17px 19px;border-bottom:1px solid var(--line);z-index:5}
.modalhead h2{font-size:19px;margin:0}
.modalbody{padding:17px 19px 22px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.formgrid .span{grid-column:1/-1}
.formfoot{position:sticky;bottom:0;background:white;padding:11px 0 0;margin-top:14px;border-top:1px solid var(--line);display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap}
.series-edit{margin:15px 0;background:#f9f9f6;padding:11px;border-radius:11px}
.series-head{display:grid;grid-template-columns:28px repeat(4,minmax(0,1fr));gap:5px;margin-bottom:5px;font-size:10px;font-weight:750;color:#6f716e}
.seriesrow{display:grid;grid-template-columns:28px repeat(4,minmax(0,1fr));gap:5px;align-items:center;margin-bottom:6px}
.seriesrow input{padding:7px 5px;font-size:12px;text-align:center}
.seriesrow span{font-size:12px;font-weight:750}
.form-rm-tools{display:flex;gap:8px;flex-wrap:wrap;margin:7px 0}
.fielddesc{font-size:11px;color:#666;margin-top:5px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);max-width:90vw;padding:10px 16px;background:#252525;color:white;border-radius:11px;z-index:999;font-size:13px;box-shadow:0 6px 22px #0004;opacity:0;pointer-events:none;transition:opacity .15s}
.toast.visible{opacity:1}
.only-screen-reader{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
.safety{background:#fff9e7;border:1px solid #eddaa0;border-radius:10px;padding:12px;margin:8px 0;font-size:12px}
.library-search-count{font-size:12px;margin:10px 0;color:#6b6b66}
.week-status{display:inline-flex;align-items:center;gap:5px;border-radius:9px;padding:5px 9px;font-size:11px;background:#f2f1e9;font-weight:750}

@media(max-width:750px){.app{padding:12px 11px 85px}
.brand h1{font-size:20px}
.brandmark{width:39px;height:39px}
.paper{padding:13px;border-radius:14px}
.header{margin-bottom:9px}
.header-actions{width:100%}
.header-actions>.btn{flex:1}
.daygrid{gap:3px}
.daybtn{padding:8px 2px}
.daybtn span{font-size:11px}
.daybtn small{font-size:10px}
.lead h2{font-size:21px}
.week-title{font-size:16px}
.weekbar{align-items:flex-start}
.weekbar-actions{width:100%}
.weekbar-actions .btn{flex:1}
.library-toolbar{grid-template-columns:1fr 1fr}
.library-toolbar .field:first-child{grid-column:1/-1}
.loggrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid2,.history-list{grid-template-columns:1fr}
.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.modalbody{padding:13px 12px 18px}
.modalhead{padding:14px 13px}
.seriesrow{gap:3px}
.seriesrow input{padding:8px 3px}
.brand small{font-size:11px}
.rm-row{grid-template-columns:minmax(100px,1fr) 100px 34px;gap:6px}
.rm-row strong{font-size:12px}
}

@media(max-width:360px){.daybtn small{display:none}
.daybtn span{font-size:11px}
.nav{font-size:12px;padding:8px 11px}
.formgrid{grid-template-columns:1fr}
.formgrid .span{grid-column:auto}
.loggrid{grid-template-columns:1fr 1fr}
.setlogrow{grid-template-columns:27px repeat(4,minmax(0,1fr))}
.setlogrow input{font-size:11px}
.btn{font-size:12px;padding:8px 9px}
}


/* ===== Entrenardos V3.2: mobile-first usability and Safari/Chrome iOS consistency ===== */
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  scroll-behavior: smooth;
}

button, input, select, textarea {
  -webkit-appearance: none;
  appearance: none;
  -webkit-tap-highlight-color: transparent;
}
input[type="checkbox"] { -webkit-appearance: auto; appearance: auto; }
button { color: var(--ink); }
.btn, .nav, .daybtn { touch-action: manipulation; }
button:active { filter: brightness(.97); }
.paper, .block, .workout-card { overflow-wrap: anywhere; }
.itemhead > div:first-child, .blockhead > div:first-child, .lead > div:first-child {
  min-width: 0;
}
input, select, textarea { max-width: 100%; }
.week-title, .week-status, .chip, .presc { overflow-wrap: anywhere; }
/* Small inline badge indicating selected app revision */
.app-version { font-size: 10px; color: var(--muted); }

 if(raw){try{const o=JSON.parse(raw);if(o&&o.version===3&&Array.isArray(o.rms)&&o.weeks&&Array.isArray(o.customWods)&&Array.isArray(o.favorites))db=o;}catch(e){console.warn('Datos anteriores no válidos',e);}}
 if(db&&!Array.isArray(db.libraryWods))db.libraryWods=[];
 if(db&&!Array.isArray(db.favoriteWods))db.favoriteWods=[];
 if(!db){db=freshDb();const d=today(),base=monday(d);if(d.getDay()===0)base.setDate(base.getDate()+7);db.weeks[iso(base)]=initialWeek();save();}
 const nowWeek=thisWeek();ui.week=db.weeks[nowWeek]?nowWeek:Object.keys(db.weeks).sort().at(-1)||nowWeek;
 const day=(today().getDay()+6)%7;ui.day=ui.week===nowWeek?day:0;
 render();
}
function resetActual(e){e.actual={done:false,completedAt:'',summary:{kg:'',reps:'',rir:'',rest:'',notes:''},rows:[]};}
function carryActualWeights(source,target){
 if(!source||!target)return 0;let updated=0;
 source.days.forEach((sd,di)=>{
  const td=target.days[di];if(!td)return;
  for(const sb of sd.blocks)for(const previous of sb.items){
   if(!previous.actual?.done)continue;
   let now=null;for(const tb of td.blocks){now=tb.items.find(x=>x.id===previous.id);if(now)break;}
   if(!now)continue;
   for(let i=0;i<now.rows.length;i++){
    const r=now.rows[i];
    // Percentages linked to an RM always remain dynamic, never convert to fixed weights.
    if(now.rmId&&Number.isFinite(num(r.pct)))continue;
    const logged=previous.actual.rows?.[i]?.kg||previous.actual.summary?.kg;
    if(Number.isFinite(num(logged))&&num(logged)>0){r.fixedKg=String(num(logged));updated++;}
   }
  }
 });return updated;
}
function ensureWeek(key){
 if(db.weeks[key])return db.weeks[key];
 const keys=Object.keys(db.weeks).filter(k=>k<key).sort();const prev=keys.at(-1);let next;
 if(prev){
  next=clone(db.weeks[prev]);next.createdAt=new Date().toISOString();
  carryActualWeights(db.weeks[prev],next);
  for(const day of next.days)for(const b of day.blocks){for(const x of b.items)resetActual(x);for(const w of b.wods)w.actual={done:false,completedAt:'',time:'',rounds:'',score:'',notes:''};}
 }else next=emptyWeek();
 db.weeks[key]=next;save();return next;
}
function week(){return ensureWeek(ui.week);}
function curDay(){return week().days[ui.day];}
function getBlock(bid){return curDay().blocks.find(x=>x.id===bid);}
function getEx(eid){for(const b of curDay().blocks){const x=b.items.find(v=>v.id===eid);if(x)return {block:b,x};}return null;}
function getWod(wid){for(const b of curDay().blocks){const x=b.wods.find(v=>v.id===wid);if(x)return {block:b,x};}return null;}
function calcKg(exercise,r){
 const fixed=num(r.fixedKg);
 if(Number.isFinite(fixed))return fixed;
 const reference=db.rms.find(r=>r.id===exercise.rmId);
 const pct=num(r.pct);
 if(!reference||!Number.isFinite(pct))return null;
 const step=num(db.settings.stepKg,2.5)||2.5;
 return Math.round((num(reference.value,0)*pct/100)/step)*step;
}
function weightText(kg){return kg===null?'—':pnum(kg)+' kg';}
function exGoal(exercise){const ref=db.rms.find(r=>r.id===exercise.rmId);const k=exercise.rows.map(r=>calcKg(exercise,r)).filter(x=>x!==null);const ps=exercise.rows.map(r=>num(r.pct)).filter(Number.isFinite);return {ref,ks:k,ps,first:k[0]??null,last:k.at(-1)??null};}
function ensureActualRows(e){if(!Array.isArray(e.actual.rows))e.actual.rows=[];while(e.actual.rows.length<e.rows.length)e.actual.rows.push({kg:'',reps:'',rir:'',rest:''});return e.actual.rows;}
function libraryAll(){return [...db.customWods,...(db.libraryWods||[])];}
function findWodById(wid){return db.customWods.find(x=>x.id===wid)||(db.libraryWods||[]).find(x=>x.id===wid)||(db.favoriteWods||[]).find(x=>x.id===wid);}
function isFav(wid){return db.favorites.includes(wid);}
function detectWodType(text){const t=fold(text);if(/amrap\s*\d+/.test(t))return 'AMRAP';if(/\b\d+\s*(?:rft|rondas? for time|rounds? for time)\b/.test(t))return 'RFT';if(/for time/.test(t))return 'For Time';if(/\bemom\b/.test(t))return 'EMOM';if(/\b(?:every|e2mom|e3mom)\b/.test(t))return 'Every / Intervalos';if(/\b(?:on|off|intervalos?)\b/.test(t))return 'Intervalos';return 'Otro';}
function normalizeWodSearch(q){return fold(q).replace(/\bt2b\b/g,'toes to bar').replace(/\bttb\b/g,'toes to bar').replace(/\bc2b\b/g,'chest to bar').replace(/\bbmu\b/g,'bar muscle up').replace(/\brmu\b/g,'ring muscle up').replace(/\bpc\b/g,'power clean').trim();}
function searchCorpus(w){return normalizeWodSearch([w.title,w.text,w.format,w.category,w.originalCategory,w.source,...(w.movements||[])].join(' '));}
function countDone(key){const w=db.weeks[key];if(!w)return {done:0,total:0};let done=0,total=0;for(const d of w.days)for(const b of d.blocks){for(const e of b.items){total++;if(e.actual?.done)done++;}for(const x of b.wods){total++;if(x.actual?.done)done++;}}return {done,total};}

function exerciseFoldKey(e){return `${ui.week}|${ui.day}|${e.id}`;}
function compactReps(rows){
 const parts=[];
 for(const r of rows){const val=String(r.reps||'—');const last=parts.at(-1);if(last&&last.val===val)last.n++;else parts.push({val,n:1});}
 if(parts.length>5)return `${rows[0]?.reps||'—'}…${rows.at(-1)?.reps||'—'}`;
 return parts.map(x=>x.n>1?`${x.n}×${x.val}`:x.val).join(' + ');
}
function exerciseBrief(e){
 const g=exGoal(e),ps=e.rows.map(r=>num(r.pct)).filter(Number.isFinite),kg=g.ks;
 const pctText=ps.length&&g.ref?(Math.min(...ps)===Math.max(...ps)?`${pnum(ps[0])}%`:`${pnum(Math.min(...ps))}–${pnum(Math.max(...ps))}%`):'';
 const kgText=kg.length?(Math.min(...kg)===Math.max(...kg)?`${pnum(kg[0])} kg`:`${pnum(Math.min(...kg))}–${pnum(Math.max(...kg))} kg`):'';
 const rir=currentRir(e);
 return `<span class="exercise-brief-chip">${e.rows.length} series · ${safe(compactReps(e.rows))} reps</span>
 <span class="exercise-brief-chip">${safe(e.scheme)}${e.durationMin?` · ${safe(e.durationMin)} min`:''}</span>
 ${pctText?`<span class="exercise-brief-chip accent">${safe(pctText)} ${safe(g.ref.name)}</span>`:''}
 ${kgText?`<span class="exercise-brief-chip accent">${safe(kgText)}</span>`:''}
 ${rir!=='—'?`<span class="exercise-brief-chip">RIR ${safe(rir)}</span>`:''}
 ${!pctText&&!kgText&&rir==='—'?'<span class="exercise-brief-chip">Carga por definir</span>':''}`;
}

     ${plan?`<div class="series-preview" aria-label="Objetivos de las ${sets} series">${rows}</div>`:renderExLog(e)}

function exerciseDraftKey(e){return `${ui.week}|${ui.day}|${e.id}`;}
function getExerciseDraft(e){return exerciseDrafts[exerciseDraftKey(e)]||{rows:{}};}
function hasDraftChanges(e){const d=getExerciseDraft(e);return !!(d.rows&&Object.values(d.rows).some(v=>v&&Object.keys(v).length))||Object.prototype.hasOwnProperty.call(d,'notes');}
function persistExerciseDrafts(){
 if(!storageSupported)return;
 try{localStorage.setItem(DRAFT_KEY,JSON.stringify(exerciseDrafts));}
 catch(e){console.warn('No se pudo guardar el borrador de ejercicio',e);}
}
// Un porcentaje siempre se calcula contra el RM seleccionado; los kilos de
// registro se conservan tal cual y no se redondean cuando se editan a mano.
function fmtPct(value){if(!Number.isFinite(value))return '';return String(Math.round((value+Number.EPSILON)*100)/100);}
function kgFromPercent(exercise,percent){
 const rm=db.rms.find(x=>x.id===exercise.rmId),p=num(percent);
 if(!rm||!Number.isFinite(p)||!Number.isFinite(num(rm.value))||num(rm.value)<=0)return '';
 const step=num(db.settings.stepKg,2.5)||2.5;
 return String(Math.round((num(rm.value)*p/100)/step)*step);
}
function percentFromKg(exercise,kg){
 const rm=db.rms.find(x=>x.id===exercise.rmId),k=num(kg);
 if(!rm||!Number.isFinite(k)||!Number.isFinite(num(rm.value))||num(rm.value)<=0)return '';
 return fmtPct(k/num(rm.value)*100);
}
function exerciseHasPercentage(exercise){return !!db.rms.find(x=>x.id===exercise.rmId);}
function plannedSetValue(e,r,field){
 if(field==='kg'){const kg=calcKg(e,r);return kg===null?'':String(kg);}
 if(field==='pct')return e.rmId?String(r.pct??''):'';
 if(field==='reps')return String(r.reps??'');
 if(field==='rir')return String(r.rir??'');
 if(field==='rest')return e.restSec===''||e.restSec===null||e.restSec===undefined?'':String(e.restSec);
 return '';
}
function originalSetValue(e,index,field){
 const recorded=e.actual?.rows?.[index];
 // Data from V3.2 are preserved. An unsaved legacy series is shown if it had
 // been entered by hand, but it is NOT regarded as completed in V3.3.
 if(recorded&&e.actual?.done&&Object.prototype.hasOwnProperty.call(recorded,field))return String(recorded[field]??'');
 if(field==='pct'&&recorded&&e.actual?.done&&e.rmId){
  const snap=e.actual?.plannedSnapshot?.rows?.[index],kg=num(recorded.kg);
  if(snap&&Number.isFinite(kg)&&Number.isFinite(num(snap.kg))&&Math.abs(kg-num(snap.kg))<0.0001&&snap.pct!=='')return String(snap.pct);
  const rmValue=num(e.actual?.rmValueAtSave,db.rms.find(r=>r.id===e.rmId)?.value);
  if(Number.isFinite(kg)&&rmValue>0)return fmtPct(kg/rmValue*100);
 }
 return plannedSetValue(e,e.rows[index],field);
}
function shownSetValue(e,index,field){
 const overrides=getExerciseDraft(e).rows?.[index];
 if(overrides&&Object.prototype.hasOwnProperty.call(overrides,field))return String(overrides[field]??'');
 return originalSetValue(e,index,field);
}
function shownExerciseNotes(e){
 const d=getExerciseDraft(e);
 return Object.prototype.hasOwnProperty.call(d,'notes')?String(d.notes):String(e.actual?.summary?.notes??'');
}
function updateExerciseDraft(e,index,field,value){
 const key=exerciseDraftKey(e),draft=exerciseDrafts[key]||{rows:{}};
 if(field==='notes'){
  const original=String(e.actual?.summary?.notes??'');
  if(value===original)delete draft.notes;else draft.notes=value;
 }else{
  draft.rows ||= {};
  draft.rows[index] ||= {};
  if(String(value)===originalSetValue(e,index,field))delete draft.rows[index][field];
  else draft.rows[index][field]=String(value);
  if(!Object.keys(draft.rows[index]).length)delete draft.rows[index];
 }
 if(!Object.keys(draft.rows||{}).length&&!Object.prototype.hasOwnProperty.call(draft,'notes'))delete exerciseDrafts[key];
 else exerciseDrafts[key]=draft;
 persistExerciseDrafts();
 return hasDraftChanges(e);
}

function saveExerciseFromSeries(e){
 if(!e||!Array.isArray(e.rows)||!e.rows.length){toast('El ejercicio necesita al menos una serie');return;}
 const actual=e.actual||{};
 const rows=e.rows.map((r,i)=>Object.fromEntries(['reps','pct','kg','rir','rest'].map(f=>[f,shownSetValue(e,i,f)])));
 const notes=shownExerciseNotes(e);
 const same=field=>{const v=rows.map(r=>String(r[field]??''));return v.length&&v[0]!==''&&v.every(x=>x===v[0])?v[0]:'';};
 const prior=clone(actual);
 actual.rows=rows;
 actual.summary={kg:same('kg'),pct:same('pct'),reps:same('reps'),rir:same('rir'),rest:same('rest'),notes};
 const matchedRM=db.rms.find(r=>r.id===e.rmId);
 if(matchedRM){actual.rmValueAtSave=num(matchedRM.value);actual.rmNameAtSave=matchedRM.name;}
 actual.done=true;
 actual.completedAt=new Date().toISOString();
 actual.plannedSnapshot=plannedExerciseSnapshot(e);
 e.actual=actual;
 if(!save()){
  e.actual=prior;
  toast('No se pudo guardar. Conserva una copia de seguridad.');
  return;
 }
 delete exerciseDrafts[exerciseDraftKey(e)];persistExerciseDrafts();
 render();toast('✓ Ejercicio guardado con todas sus series.');
}
function renderExLog(e){

 const status=dirty?'Cambios sin guardar':done?'✓ Registrado':'Preparado para registrar';
 const cls=dirty?'editing':done?'saved':'planned';
 const hasPercent=exerciseHasPercentage(e),rm=db.rms.find(r=>r.id===e.rmId);
 const fields=hasPercent?['reps','pct','kg','rir','rest']:['reps','kg','rir','rest'];

 return `<div class="logpanel exercise-register" data-exercise-log="${safe(e.id)}">
 <div class="exercise-log-intro"><span class="exercise-log-status ${cls}" data-exlogstatus="${safe(e.id)}">${status}</span><span class="smalltext subtle">${sets} series · valores inicialmente programados</span></div>
 <div class="exercise-log-legend">Si hiciste lo previsto, pulsa «Guardar ejercicio». Si cambió alguna serie, edítala y guarda.</div>
 ${hasPercent?`<div class="exercise-rm-helper">RM de referencia: <strong>${safe(rm.name)} (${pnum(rm.value)} kg)</strong> · Los porcentajes se corresponden con los kilos que registres. Al editar el porcentaje, los kilos se redondean al escalón de ${pnum(num(db.settings.stepKg,2.5)||2.5)} kg.</div>`:''}
 <div class="series-live ${hasPercent?'has-pct':'no-pct'}" role="group" aria-label="Registro de las ${sets} series de ${safe(e.name)}">
 <div class="setlogrow series-live-header" aria-hidden="true"><span>Serie</span>${fields.map(f=>`<span>${heads[f]}</span>`).join('')}</div>
 ${e.rows.map((r,i)=>`<div class="setlogrow series-live-row" data-series-number="${i+1}"><span class="series-number" title="Objetivo: ${safe(r.reps)} reps, ${weightText(calcKg(e,r))}">${i+1}</span>${fields.map(f=>{

function useLibraryWodInContext(wid,ctx){

 const days=ensureWeek(ctx.week).days;
 const target=days[ctx.day];if(!target){toast('No se encuentra el día elegido');return;}
 if(ctx.replaceWodId){
  let matched=null;
  for(const b of target.blocks){const hit=b.wods.find(x=>x.id===ctx.replaceWodId);if(hit){matched=hit;break;}}
  if(!matched){toast('El WOD original ya no está disponible');return;}
  if(matched.actual?.done&&!confirm('El WOD original ya está registrado como realizado. Al sustituirlo se perderá su resultado. ¿Continuar?'))return;
  Object.assign(matched,{title:src.title,text:src.text,format:src.format,source:src.source||'Biblioteca privada',libraryId:src.id,actual:{done:false,completedAt:'',time:'',rounds:'',score:'',notes:''}});
 }else if(ctx.addNewBlock){
  target.blocks.push(block('WOD adicional','WOD',[],[wod(src.title,src.text,{format:src.format,source:src.source,libraryId:src.id})]));
 }else{
  let blockref=target.blocks.find(b=>b.id===ctx.blockId);
  if(!blockref){blockref=block('WOD','WOD');target.blocks.push(blockref);}
  blockref.wods.push(wod(src.title,src.text,{format:src.format,source:src.source,libraryId:src.id}));
 }
 ui.week=ctx.week;ui.day=ctx.day;ui.page='semana';ui.addContext=null;save();render();

}

async function importPrivateLibrary(file){
 if(!file)return;let parsed;
 try{parsed=JSON.parse(await file.text());}catch{toast('El archivo de biblioteca no es un JSON v\u00e1lido');return;}
 const incoming=Array.isArray(parsed)?parsed:parsed?.wods;
 if(!Array.isArray(incoming)||!incoming.length||incoming.length>20000||incoming.some(w=>!w||typeof w.id!=='string'||typeof w.title!=='string'||typeof w.text!=='string')){toast('No es una biblioteca de WOD compatible');return;}
 const existing=new Map((db.libraryWods||[]).map(w=>[w.id,w]));
 for(const w of incoming)existing.set(w.id,w);

}

 if(el.id==='libType'){ui.libraryType=el.value;ui.libraryLimit=24;renderLibraryCards();return;}
 if(el.id==='roundStep'){db.settings.stepKg=num(el.value,2.5);save();render();return;}
 if(el.hasAttribute('data-rm')){const r=db.rms.find(x=>x.id===el.dataset.rm);if(r){const n=num(el.value);if(!Number.isFinite(n)||n<=0){toast('Introduce un RM positivo');render();return;}r.value=n;save();render();toast('RM actualizado: porcentajes recalculados');}return;}
 if(el.hasAttribute('data-donewod')){const o=getWod(el.dataset.donewod);if(o){
  o.x.actual.done=el.checked;o.x.actual.completedAt=el.checked?new Date().toISOString():'';
  if(el.checked)o.x.actual.plannedSnapshot={title:o.x.title,text:o.x.text,format:o.x.format,source:o.x.source};
  save();render();if(el.checked)toast('WOD marcado: texto planificado guardado; a\u00f1ade el resultado si lo tienes.');
 }return;}
});
$('#restoreFile').addEventListener('change',async e=>{await restoreBackup(e.target.files?.[0]);e.target.value='';});
$('#libraryFile').addEventListener('change',async e=>{await importPrivateLibrary(e.target.files?.[0]);e.target.value='';});
$('#editModal').addEventListener('close',()=>{modalDraft=null;});
window.addEventListener('storage',e=>{if(e.key===STORE_KEY&&e.newValue){try{const fresh=JSON.parse(e.newValue);if(fresh.version===3){db=fresh;render();toast('Datos actualizados desde otra pestaña');}}catch{}}});
if(!storageSupported){$('#saveLabel').textContent='⚠ Este navegador no permite guardar datos';$('#stateStatus').textContent='⚠ Sin almacenamiento';}
init();
})();

</script>
<script>
window.addEventListener('load', function () {
  var b = document.querySelector('.brandmark');
  if (!b || getComputedStyle(b).display === 'grid') return;
  /* Last chance to load the separate CSS if the browser ignored the inline style. */
  var retry = document.createElement('link');
  retry.rel = 'stylesheet';
  retry.href = './styles.css?v=3.6-retry';
  retry.onload = function () {
    if (getComputedStyle(b).display !== 'grid') showStyleHelp();
  };
  retry.onerror = showStyleHelp;
  document.head.appendChild(retry);
  function showStyleHelp() {
    if (getComputedStyle(b).display === 'grid') return;
    var n = document.createElement('div');
    n.setAttribute('role','alert');
    n.style.cssText = 'position:relative;margin:10px;padding:12px;background:#fff3ce;border:2px solid #c49b00;border-radius:10px;color:#171717;font:14px/1.4 Arial,sans-serif';
    n.textContent = 'No se han cargado los estilos de Entrenardos. Comprueba que styles.css está en la misma carpeta que index.html en GitHub y actualiza la página.';
    document.body.insertBefore(n,document.body.firstChild);
  }
});
</script>
</body></html>
